<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MSDF Explorer — 3D Interactive with Layer Slicing</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; color: #eee; font-family: monospace; }
  #ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: #222; padding: 10px; border-radius: 6px; max-height: 90vh; overflow-y: auto; }
  #canvas-container { width: 100vw; height: 100vh; }
  input[type=range] { width: 200px; }
  label { display: block; margin: 8px 0 4px; }
  button { margin: 8px 0; padding: 6px 12px; background: #444; color: white; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #555; }
  button:disabled { background: #333; color: #777; cursor: not-allowed; }
  
  /* Layers table styling */
  #layers-section { margin-top: 20px; border-top: 1px solid #444; padding-top: 15px; }
  #layers-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  #layers-table th, #layers-table td { border: 1px solid #444; padding: 6px; text-align: left; }
  #layers-table th { background: #333; }
  #layers-table tr:nth-child(even) { background: #2a2a2a; }
  .layer-action-btn { padding: 3px 8px; margin: 2px; font-size: 12px; }
  
  /* Slice preview styling */
  .slice-preview { position: fixed; right: 20px; top: 20px; background: #222; padding: 10px; border-radius: 6px; z-index: 100; display: none; }
  .slice-preview canvas { border: 1px solid #444; }
</style>
</head>
<body>

<div id="ui">
  <label for="upload">Upload Image:</label>
  <input type="file" id="upload" accept="image/*" />
  
  <label for="shiftRange">Horizontal Shift: <span id="shiftVal">0</span> px</label>
  <input type="range" id="shiftRange" min="0" max="0" value="0" />
  
  <button id="generateBtn" disabled>Generate 3D Pattern</button>
  
  <div id="layers-section" style="display: none;">
    <h3>Layer Slices</h3>
    <button id="generateSlicesBtn">Generate Slices from Points</button>
    <table id="layers-table">
      <thead>
        <tr>
          <th>Z-Level</th>
          <th>Points</th>
          <th>Color</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="layers-tbody">
      </tbody>
    </table>
  </div>
</div>

<div id="canvas-container"></div>

<div id="slice-preview" class="slice-preview">
  <h4>Slice Preview</h4>
  <canvas id="slice-canvas"></canvas>
  <div>
    <button id="save-slice-btn">Save Slice as PNG</button>
    <button id="close-preview-btn">Close Preview</button>
  </div>
</div>

<script type="module">

import * as THREE from './js/build/three.module.js';
import { OrbitControls } from './js/examples/jsm/controls/OrbitControls.js';

let scene, camera, renderer, controls;
let geometry, mesh;
let canvasWidth = 512, canvasHeight = 512;
let imgOriginal = null;
let imgFlipped = null;
let hardMixCanvas, hardMixCtx;
let depthPoints = [];
let pointCloud;
let maxShift = 0;
let layers = {};
let currentSliceZ = 0;

const container = document.getElementById('canvas-container');
const uploadInput = document.getElementById('upload');
const shiftRange = document.getElementById('shiftRange');
const shiftVal = document.getElementById('shiftVal');
const generateBtn = document.getElementById('generateBtn');
const generateSlicesBtn = document.getElementById('generateSlicesBtn');
const layersSection = document.getElementById('layers-section');
const layersTbody = document.getElementById('layers-tbody');
const slicePreview = document.getElementById('slice-preview');
const sliceCanvas = document.getElementById('slice-canvas');
const saveSliceBtn = document.getElementById('save-slice-btn');
const closePreviewBtn = document.getElementById('close-preview-btn');

initThreeJS();

uploadInput.addEventListener('change', handleImageUpload);
shiftRange.addEventListener('input', onShiftChange);
generateBtn.addEventListener('click', generate3DPattern);
generateSlicesBtn.addEventListener('click', generateSlices);
saveSliceBtn.addEventListener('click', saveSliceAsPNG);
closePreviewBtn.addEventListener('click', () => slicePreview.style.display = 'none');

function initThreeJS() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 400);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.1;

  window.addEventListener('resize', onWindowResize);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => {
    loadImage(e.target.result);
  };
  reader.readAsDataURL(file);
}

function loadImage(src) {
  imgOriginal = new Image();
  imgOriginal.crossOrigin = "anonymous";
  imgOriginal.onload = () => {
    canvasWidth = imgOriginal.width;
    canvasHeight = imgOriginal.height;

    // Update shiftRange max value
    shiftRange.max = canvasWidth;
    shiftRange.value = 0;
    shiftVal.textContent = '0';

    // Prepare flipped image
    imgFlipped = document.createElement('canvas');
    imgFlipped.width = canvasWidth;
    imgFlipped.height = canvasHeight;
    const ctxFlipped = imgFlipped.getContext('2d');
    ctxFlipped.translate(canvasWidth, 0);
    ctxFlipped.scale(-1, 1);
    ctxFlipped.drawImage(imgOriginal, 0, 0);

    // Prepare hard mix canvas
    hardMixCanvas = document.createElement('canvas');
    hardMixCanvas.width = canvasWidth;
    hardMixCanvas.height = canvasHeight;
    hardMixCtx = hardMixCanvas.getContext('2d');

    generateBtn.disabled = false;
    alert('Image loaded, ready to generate 3D pattern.');
  };
  imgOriginal.src = src;
}

function onShiftChange(e) {
  const val = parseInt(e.target.value, 10);
  shiftVal.textContent = val;
  if (pointCloud) {
    // Regenerate point cloud with new shift in real time
    generate3DPattern(val);
  }
}

function generate3DPattern(shiftParam) {
  const shift = typeof shiftParam === 'number' ? shiftParam : parseInt(shiftRange.value, 10);

  // Hard Mix: combine original and flipped with horizontal shift using Hard Mix effect
  // We simulate hard mix by comparing pixels; result is either black or white

  hardMixCtx.clearRect(0, 0, canvasWidth, canvasHeight);

  // Draw original
  hardMixCtx.globalCompositeOperation = 'source-over';
  hardMixCtx.drawImage(imgOriginal, 0, 0);

  // Draw flipped shifted with 'difference' mode as a close approximation
  hardMixCtx.globalCompositeOperation = 'difference';
  hardMixCtx.drawImage(imgFlipped, shift, 0);

  // Get pixel data
  const imgData = hardMixCtx.getImageData(0, 0, canvasWidth, canvasHeight);
  const data = imgData.data;

  // Remove old point cloud if exists
  if (pointCloud) {
    scene.remove(pointCloud);
    pointCloud.geometry.dispose();
    pointCloud.material.dispose();
    pointCloud = null;
  }

  depthPoints = [];
  const geometryPoints = new THREE.BufferGeometry();
  const positions = [];
  const colors = [];

  // Clear previous layers
  layers = {};

  for (let y = 0; y < canvasHeight; y += 2) {
    for (let x = 0; x < canvasWidth; x += 2) {
      const idx = (y * canvasWidth + x) * 4;
      const r = data[idx];
      const g = data[idx+1];
      const b = data[idx+2];
      const brightness = (r + g + b) / (3 * 255);

      if (brightness > 0.1) {
        // x, y as horizontal/vertical plane
        // z is from shift — map brightness to z depth, exaggerate z for visibility
        const z = (brightness) * 100;

        positions.push(x - canvasWidth/2);
        positions.push(canvasHeight/2 - y);
        positions.push(z);

        colors.push(brightness, brightness, brightness);
        
        // Store point for later slicing
        depthPoints.push({x: x, y: y, z: z, brightness: brightness});
      }
    }
  }

  geometryPoints.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometryPoints.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 1.8,
    vertexColors: true,
    sizeAttenuation: true,
  });

  pointCloud = new THREE.Points(geometryPoints, material);
  scene.add(pointCloud);
  
  // Show the layers section
  layersSection.style.display = 'block';
}

function generateSlices() {
  // Clear previous layers
  layers = {};
  layersTbody.innerHTML = '';
  
  // Group points by Z value (rounded to nearest integer for binning)
  depthPoints.forEach(point => {
    const zKey = Math.round(point.z);
    if (!layers[zKey]) {
      layers[zKey] = [];
    }
    layers[zKey].push(point);
  });
  
  // Create table rows for each layer
  Object.keys(layers).sort((a, b) => b - a).forEach(zKey => {
    const points = layers[zKey];
    const row = document.createElement('tr');
    
    // Z-Level cell
    const zCell = document.createElement('td');
    zCell.textContent = zKey;
    row.appendChild(zCell);
    
    // Points count cell
    const countCell = document.createElement('td');
    countCell.textContent = points.length;
    row.appendChild(countCell);
    
    // Color indicator cell
    const colorCell = document.createElement('td');
    const colorBox = document.createElement('div');
    const brightness = points[0].brightness;
    colorBox.style.width = '20px';
    colorBox.style.height = '20px';
    colorBox.style.backgroundColor = `rgb(${brightness*255}, ${brightness*255}, ${brightness*255})`;
    colorBox.style.border = '1px solid #555';
    colorCell.appendChild(colorBox);
    row.appendChild(colorCell);
    
    // Actions cell
    const actionsCell = document.createElement('td');
    
    const viewBtn = document.createElement('button');
    viewBtn.textContent = 'View';
    viewBtn.className = 'layer-action-btn';
    viewBtn.onclick = () => previewSlice(zKey);
    actionsCell.appendChild(viewBtn);
    
    const saveBtn = document.createElement('button');
    saveBtn.textContent = 'Save';
    saveBtn.className = 'layer-action-btn';
    saveBtn.onclick = () => saveSlice(zKey);
    actionsCell.appendChild(saveBtn);
    
    row.appendChild(actionsCell);
    
    layersTbody.appendChild(row);
  });
}

function previewSlice(zKey) {
  const points = layers[zKey];
  if (!points || points.length === 0) return;
  
  // Set up canvas for slice preview
  sliceCanvas.width = canvasWidth;
  sliceCanvas.height = canvasHeight;
  const ctx = sliceCanvas.getContext('2d');
  
  // Clear canvas
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvasWidth, canvasHeight);
  
  // Draw points
  ctx.fillStyle = 'white';
  points.forEach(point => {
    ctx.fillRect(point.x, point.y, 2, 2);
  });
  
  // Show preview
  slicePreview.style.display = 'block';
  currentSliceZ = zKey;
}

function saveSlice(zKey) {
  const points = layers[zKey];
  if (!points || points.length === 0) return;
  
  // Create a canvas for the slice
  const canvas = document.createElement('canvas');
  canvas.width = canvasWidth;
  canvas.height = canvasHeight;
  const ctx = canvas.getContext('2d');
  
  // Clear canvas
  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, canvasWidth, canvasHeight);
  
  // Draw points
  ctx.fillStyle = 'white';
  points.forEach(point => {
    ctx.fillRect(point.x, point.y, 2, 2);
  });
  
  // Convert to data URL and trigger download
  const dataUrl = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `slice_z_${zKey}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function saveSliceAsPNG() {
  saveSlice(currentSliceZ);
}

</script>

</body>
</html>
